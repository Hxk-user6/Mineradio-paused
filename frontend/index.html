<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mineradio</title>
    <meta name="referrer" content="no-referrer" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=UnifrakturCook:wght@700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (localStorage.getItem('mineradio-startup-fast-skip-v1') === '1') {
          document.documentElement.classList.add('startup-fast-skip-preload');
        }
        document.documentElement.classList.add(
          localStorage.getItem('mineradio-diy-player-mode-v1') === '1'
            ? 'diy-mode-preload'
            : 'simple-mode-preload'
        );
      } catch (e) {
        document.documentElement.classList.add('simple-mode-preload');
      }
    </script>
    <script src="/vendor/three.r128.min.js"></script>
    <script src="/vendor/music-tempo.min.js"></script>
    <script src="/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/sonic-topography-preset.js"></script>
    <script src="/sonic-workshop-preset.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
