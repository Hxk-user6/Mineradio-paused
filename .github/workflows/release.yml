name: Release MineradioX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v2.2.0)'
        required: true
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies and Tauri CLI
        run: |
          npm --prefix frontend ci
          npm install -g @tauri-apps/cli@^2

      - name: Run frontend checks, tests & build
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run test
          npm --prefix frontend run build

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Tauri installers (${{ matrix.target }})
        env:
          CI: 'true'
        run: tauri build --target ${{ matrix.target }}

      - name: Collect macOS ARM64 installers
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp -f src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/
          ls -lh release-artifacts/

      - name: Collect Windows x64 installers
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" -Destination "release-artifacts/" -Force
          Copy-Item -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" -Destination "release-artifacts/" -Force
          Get-ChildItem release-artifacts/

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets

      - name: List release assets
        shell: bash
        run: ls -lh release-assets/

      - name: Create & publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MineradioX ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
            docs/update/latest.yml
